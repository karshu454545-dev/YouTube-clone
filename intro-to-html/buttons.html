<!DOCTYPE html>
<html>

<head>
    <title>
        Practice Page
    </title>
    <style>
        .card {
            margin-top: 20px;
            margin-left: 20px;
            background-color: white;
            box-shadow: 3px 2px 10px grey;
            display: inline-block;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 12px;
            padding-bottom: 12px;
            border-radius: 15px;

        }

        .profile-picture {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            vertical-align: middle;

        }

        .text-box {
            border: none;
            vertical-align: middle;
            margin-left: 7px;
        }

        .tweet-button {
            background-color: rgb(29, 155, 240);
            border: none;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 10px;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            border-radius: 15px;
            vertical-align: middle;
            margin-left: 50px;
        }

        .suggestions {
            margin-top: 100px;
            margin-left: 20px;
            background-color: white;
            box-shadow: 3px 4px 10px grey;
            width: 130px;
            padding-bottom: 4px;
            padding-left: 3px;
            padding-right: 3px;
        }

        .p1 {
            width: 130px;

        }

        .p2 {
            font-size: 17px;
            margin-top: 2px;
            margin-bottom: 0px;
            margin-left: 3px;
            font-family: arial;
        }

        .p3 {
            margin-top: 2px;
            margin-bottom: 0px;
            margin-left: 3px;
            font-family: arial;
            font-size: 14px;
            color: rgb(87, 87, 87);
        }

        .p4 {
            margin-top: 10px;
            margin-left: 3px;
            border: none;
            background-color: rgb(66, 115, 238);
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 8px;
            padding-bottom: 8px;
            border-radius: 5px;
            color: white;

        }
    </style>
</head>

<body>
    <div class="card">
        <img class="profile-picture" src="cat1.jpg">
        <input type="text" class="text-box" placeholder="What's happening?">
        <button class="tweet-button">
            Tweet
        </button>
    </div>
    <div class="suggestions">
        <img src="cat.jpg" class="p1">
        <h1 class="p2">
            Oliver
        </h1>
        <p class="p3">
            2 mutual friends
        </p>
        <button class="p4">
            Add Friend
        </button>
    </div>

</body>

</html>
